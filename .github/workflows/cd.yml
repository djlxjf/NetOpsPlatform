name: CD - Package and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 1.0.1)"
        required: true
        default: "1.0.0"
      prerelease:
        description: "Is this a pre-release?"
        required: false
        default: "false"
        type: boolean

jobs:
  # 创建 Release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          release_name: NetOps Platform v${{ steps.get_version.outputs.version }}
          body: |
            ## 🚀 NetOps Platform v${{ steps.get_version.outputs.version }}

            ### 📋 更新内容
            - 查看 [CHANGELOG.md](CHANGELOG.md) 了解详细更新内容

            ### 📦 安装包
            - **Windows**: NetOpsPlatform-Setup-v${{ steps.get_version.outputs.version }}.exe
            - **macOS**: NetOpsPlatform-v${{ steps.get_version.outputs.version }}.dmg
            - **Linux**: NetOpsPlatform-v${{ steps.get_version.outputs.version }}.AppImage

            ### 🔄 自动更新
            如果已安装旧版本，应用会自动检测并更新到最新版本。

            ### 📥 安装说明
            1. 下载对应系统的安装包
            2. Windows: 双击 .exe 文件安装
            3. macOS: 打开 .dmg 文件，拖拽到 Applications 文件夹
            4. Linux: 赋予执行权限后运行 .AppImage

            ---
            **完整更新日志**: [查看详情](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.get_version.outputs.version }})
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}

  # Windows 打包
  build-windows:
    name: Build Windows
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Package Windows executable
        run: npm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build outputs
        run: |
          echo "Release directory contents:"
          Get-ChildItem -Path "release" -Recurse

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            release/*-win.exe
            release/*-win.zip
            release/latest.yml
          retention-days: 30

      - name: Upload Windows Release Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./release/NetOpsPlatform-Setup-v${{ needs.create-release.outputs.version }}.exe
          asset_name: NetOpsPlatform-Setup-v${{ needs.create-release.outputs.version }}.exe
          asset_content_type: application/octet-stream

  # macOS 打包
  build-macos:
    name: Build macOS
    needs: create-release
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Package macOS application
        run: npm run electron:build -- --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build outputs
        run: ls -la release/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            release/*-mac.dmg
            release/*-mac.zip
            release/latest-mac.yml
          retention-days: 30

      - name: Upload macOS Release Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./release/NetOpsPlatform-v${{ needs.create-release.outputs.version }}-mac.dmg
          asset_name: NetOpsPlatform-v${{ needs.create-release.outputs.version }}-mac.dmg
          asset_content_type: application/octet-stream

  # Linux 打包
  build-linux:
    name: Build Linux
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libnotify-dev libgconf-2-4 libnss3 libxss1 libasound2 libxtst6 xauth xvfb

      - name: Build web application
        run: npm run build

      - name: Package Linux application
        run: npm run electron:build -- --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build outputs
        run: ls -la release/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            release/*-linux.AppImage
            release/*-linux.deb
            release/*-linux.rpm
            release/latest-linux.yml
          retention-days: 30

      - name: Upload Linux Release Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./release/NetOpsPlatform-v${{ needs.create-release.outputs.version }}-linux.AppImage
          asset_name: NetOpsPlatform-v${{ needs.create-release.outputs.version }}-linux.AppImage
          asset_content_type: application/octet-stream

  # 生成自动更新配置
  generate-update-config:
    name: Generate Auto-Update Config
    needs: [create-release, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate update manifest
        run: |
          cat > update-manifest.json << EOF
          {
            "version": "${{ needs.create-release.outputs.version }}",
            "releaseDate": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)",
            "files": {
              "windows": {
                "url": "https://github.com/${{ github.repository }}/releases/download/v${{ needs.create-release.outputs.version }}/NetOpsPlatform-Setup-v${{ needs.create-release.outputs.version }}.exe",
                "sha512": "PLACEHOLDER",
                "size": 0
              },
              "macos": {
                "url": "https://github.com/${{ github.repository }}/releases/download/v${{ needs.create-release.outputs.version }}/NetOpsPlatform-v${{ needs.create-release.outputs.version }}-mac.dmg",
                "sha512": "PLACEHOLDER",
                "size": 0
              },
              "linux": {
                "url": "https://github.com/${{ github.repository }}/releases/download/v${{ needs.create-release.outputs.version }}/NetOpsPlatform-v${{ needs.create-release.outputs.version }}-linux.AppImage",
                "sha512": "PLACEHOLDER",
                "size": 0
              }
            },
            "releaseNotes": "查看 [CHANGELOG.md](CHANGELOG.md) 了解详细更新内容"
          }
          EOF

      - name: Upload update manifest
        uses: actions/upload-artifact@v4
        with:
          name: update-config
          path: update-manifest.json
          retention-days: 90

  # 通知
  notify:
    name: Send Notifications
    needs: [create-release, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: |
            ✅ NetOps Platform v${{ needs.create-release.outputs.version }} 发布成功！
            📦 安装包已上传到 GitHub Releases
            🔗 下载地址: <https://github.com/${{ github.repository }}/releases/tag/v${{ needs.create-release.outputs.version }}>
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: |
            ❌ NetOps Platform v${{ needs.create-release.outputs.version }} 发布失败！
            🔍 查看详情: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
