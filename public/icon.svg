<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <rect width="256" height="256" rx="48" fill="#0d1117"/>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <!-- 外圆 -->
  <circle cx="128" cy="128" r="90" fill="none" stroke="#2f81f7" stroke-width="3" opacity="0.4"/>
  <circle cx="128" cy="128" r="70" fill="none" stroke="#2f81f7" stroke-width="2" opacity="0.25"/>
  <!-- 中心图标 -->
  <circle cx="128" cy="128" r="22" fill="#2f81f7" opacity="0.9"/>
  <!-- 波形 -->
  <path d="M 55 128 Q 75 90, 90 128 Q 105 166, 120 128 Q 135 90, 150 128 Q 165 166, 180 128 Q 195 90, 200 128" 
        fill="none" stroke="#2f81f7" stroke-width="3" stroke-linecap="round"/>
  <!-- 节点点 -->
  <circle cx="55" cy="128" r="5" fill="#3fb950"/>
  <circle cx="200" cy="128" r="5" fill="#3fb950"/>
  <circle cx="128" cy="70" r="5" fill="#bc8cff"/>
  <circle cx="128" cy="186" r="5" fill="#bc8cff"/>
  <!-- 连接线 -->
  <line x1="128" y1="85" x2="128" y2="106" stroke="#484f58" stroke-width="1.5" stroke-dasharray="4 2"/>
  <line x1="128" y1="150" x2="128" y2="181" stroke="#484f58" stroke-width="1.5" stroke-dasharray="4 2"/>
  <!-- 外部节点 -->
  <circle cx="75" cy="75" r="8" fill="#1e2430" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="181" cy="75" r="8" fill="#1e2430" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="75" cy="181" r="8" fill="#1e2430" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="181" cy="181" r="8" fill="#1e2430" stroke="#30363d" stroke-width="1.5"/>
  <line x1="80" y1="80" x2="118" y2="118" stroke="#30363d" stroke-width="1"/>
  <line x1="176" y1="80" x2="138" y2="118" stroke="#30363d" stroke-width="1"/>
  <line x1="80" y1="176" x2="118" y2="138" stroke="#30363d" stroke-width="1"/>
  <line x1="176" y1="176" x2="138" y2="138" stroke="#30363d" stroke-width="1"/>
</svg>
